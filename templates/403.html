{% extends "base.html" %}

{% block title %}403 - Forbidden Access - SecureShopy{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 5rem auto; text-align: center; padding: 0 1.5rem;">
    <div style="width: 80px; height: 80px; border-radius: 50%; background: var(--danger-bg); color: var(--danger); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem;">
        <i class="fas fa-lock"></i>
    </div>
    <h1 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.75rem;">403 - Forbidden Access</h1>
    <p style="color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem;">
        Access restricted. You do not have administrative privileges to view this management resource.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center;">
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="fas fa-home"></i> Back to Home
        </a>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline btn-lg">
            <i class="fas fa-arrow-right-to-bracket"></i> Switch Account
        </a>
    </div>
</div>
{% endblock %}
